[package]
name = "ebpf-programs"
version = "0.1.0"
edition = "2021"

[dependencies]
aya-ebpf = { git = "https://github.com/aya-rs/aya", branch = "main" }
aya-ebpf-bindings = { git = "https://github.com/aya-rs/aya", branch = "main" }

[[bin]]
name = "stats"
path = "src/stats.rs"

[[bin]]
name = "printk"
path = "src/printk.rs"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
